spring.application.name=stockflow

# Server Port
server.port=8080

# Default DataSource: H2 in PostgreSQL mode for instant local & test execution
spring.datasource.url=jdbc:h2:mem:stockflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Security JWT configuration
app.jwt.secret=stockflow-production-grade-256-bit-super-secure-jwt-signing-secret-key-2026
app.jwt.expiration-ms=86400000

# Outbox polling configuration
app.outbox.poll-interval-ms=5000

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.stockflow=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corrId=%X{correlationId}] - %msg%n
