version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockflow-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-stockflow}
      POSTGRES_USER: ${DB_USERNAME:-stockflow_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockflow_secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stockflow_app} -d ${DB_NAME:-stockflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  stockflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stockflow-app
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stockflow}
      DB_USERNAME: ${DB_USERNAME:-stockflow_app}
      DB_PASSWORD: ${DB_PASSWORD:-stockflow_secret}
      APP_JWT_SECRET: ${JWT_SECRET:-stockflow-production-grade-256-bit-super-secure-jwt-signing-secret-key-2026}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
